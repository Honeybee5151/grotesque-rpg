name: Release

# Releases are driven by the VERSION file: change it (e.g. 0.1.0 -> 0.2.0), push to main, and this
# builds the game, creates the v0.2.0 tag and publishes a GitHub Release. Pushing a v* tag by hand
# also works. The in-game updater looks for the `game.pck` asset of the latest release.
on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.4.1"

jobs:
  release:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: v
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} is already released - nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install export templates
        if: steps.v.outputs.skip != 'true'
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          fi

      - name: Stamp version and repo into release.cfg
        if: steps.v.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          sed -i "s/^version=.*/version=\"${VERSION}\"/" release.cfg
          sed -i "s|^repo=.*|repo=\"${GITHUB_REPOSITORY}\"|" release.cfg
          cat release.cfg

      - name: Import project
        if: steps.v.outputs.skip != 'true'
        run: godot --headless --import || true

      - name: Export Windows, Linux and the update pack
        if: steps.v.outputs.skip != 'true'
        run: |
          mkdir -p build/windows build/linux
          godot --headless --export-release "Windows Desktop" build/windows/GrotesqueRPG.exe
          godot --headless --export-release "Linux" build/linux/GrotesqueRPG.x86_64
          godot --headless --export-pack "Windows Desktop" build/game.pck
          (cd build/windows && zip -r ../GrotesqueRPG-windows.zip .)
          (cd build/linux && zip -r ../GrotesqueRPG-linux.zip .)

      # macOS export is untested; it must never block a release.
      - name: Export macOS
        if: steps.v.outputs.skip != 'true'
        continue-on-error: true
        run: godot --headless --export-release "macOS" build/GrotesqueRPG-macos.zip

      - name: Publish release
        if: steps.v.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            build/GrotesqueRPG-windows.zip
            build/GrotesqueRPG-linux.zip
            build/GrotesqueRPG-macos.zip
            build/game.pck
